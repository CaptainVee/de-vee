<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Order Online | Devee Foods</title>
  <meta name="description" content="Browse the Devee Foods menu: combos, rice dishes, swallow and soups, proteins, small chops and drinks. Order online for delivery or pickup.">
  <meta name="theme-color" content="#C8202A">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="menu">
<main>
  <section class="page-hero"><div class="wrap">
    <h1 class="display">Our Menu</h1>
    <p>Pick your favourites and we’ll cook them fresh, ready any time.</p>
  </div></section>

  <div class="menu-tools"><div class="wrap">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C6662" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search for jollof, chicken, zobo…" aria-label="Search the menu"></label>
    <div class="tabs" id="tabs"></div>
  </div></div>

  <div class="wrap" id="menuList" style="padding-bottom:60px"></div>
</main>
<script type="module" src="js/app.js"></script>

</html>
