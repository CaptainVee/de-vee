<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order | Devee Foods</title>
  <meta name="theme-color" content="#C8202A">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="track">
<main>
  <section class="page-hero" style="padding-bottom:80px"><div class="wrap center">
    <h1 class="display">Track your order</h1>
    <p>Enter your order number and the phone number you ordered with.</p>
  </div></section>
  <div class="wrap" style="padding-bottom:70px">
    <div class="track-card">
      <form id="trackForm" novalidate>
        <div class="row2">
          <div class="field"><label for="t-id">Order number</label><input id="t-id" name="id_" placeholder="DV-XXXXX" autocomplete="off" style="text-transform:uppercase"></div>
          <div class="field"><label for="t-phone">Phone number</label><input id="t-phone" name="phone" inputmode="tel" placeholder="080..."></div>
        </div>
        <button class="btn btn-red btn-block" type="submit">Track order</button>
      </form>
      <div id="trackOut"></div>
    </div>
  </div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
